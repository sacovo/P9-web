# Edge for the P9 thesis deployment.
#
# The rover demo stack (n8n + ros2) is NOT defined here. It runs from its own
# repository under the compose project name `roverdemo`, with its own caddy
# service left out (that repo's `public` profile), so it stays standalone-
# runnable exactly as its README documents. This file only adds the edge:
# TLS termination, the static sites, and the canvas renderer.
#
# This project OWNS the shared network `p9-edge`; the demo stack joins it via
# deploy/roverdemo.override.yml. The dependency points this way on purpose, so
# the edge and the thesis site come up on their own — before the rover stack
# exists, and while it is being rebuilt. Caddy resolves `n8n` and `ros2` per
# request, so their absence is a 502 on those two hosts, not a failed start.

name: p9

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      # The zone the stack moved off. Defaulted rather than required: the
      # Caddyfile's redirect block names it unconditionally, and an empty value
      # there would produce site addresses like `p9.` and fail the config load.
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:-fhnw-rover.sacovo.ch}
      SITE_LABEL: ${SITE_LABEL:-p9}
      N8N_LABEL: ${N8N_LABEL:-n8n-demo}
      TURTLE_LABEL: ${TURTLE_LABEL:-n8n-turtle}
      PREVIEW_LABEL: ${PREVIEW_LABEL:-n8n-preview}
      RECAP_LABEL: ${RECAP_LABEL:-recap-demo}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./recap:/srv/recap:ro
      # Independent sites, one directory per domain, pulled in by the `import`
      # at the end of the Caddyfile. Each is deployed by its own repository over
      # an rrsync key scoped to a single sites/<domain>/public, so another
      # project's deploy cannot reach this stack's files. That isolation is the
      # whole reason this is one mount rather than more ./dirs above.
      #
      # Absolute, and deliberately outside the compose project directory: these
      # sites outlive any single deploy of P9-web, and deploy.sh rsyncs into
      # ~/p9/deploy with --delete.
      - ${SITES_DIR:-/home/debian/sites}:/srv/sites:ro
      - caddy_data:/data # Let's Encrypt certs + ACME account key. Do not wipe.
      - caddy_config:/config
    networks:
      - edge

  # Renders workflow canvases for <n8n-demo> and nothing else. No credentials,
  # no imported workflows, a throwaway database. N8N_PREVIEW_MODE is safe here
  # precisely because there is nothing on this instance worth reaching.
  #
  # It runs the demo's own image rather than stock n8n: a canvas can only draw
  # a node whose type it knows, and stock n8n has never heard of
  # @fhnw-rover/n8n-nodes-ros2 — every ROS node came out as "?" with "detailed
  # node info is not available". Same image as the editor, minus everything
  # that makes the editor worth attacking.
  n8n-preview:
    image: ${N8N_PREVIEW_IMAGE:-ghcr.io/sacovo/n8n-nodes-ros2:n8n-amd64}
    restart: unless-stopped
    environment:
      N8N_PREVIEW_MODE: 'true'
      N8N_PROTOCOL: https
      N8N_HOST: ${PREVIEW_LABEL:-n8n-preview}.${BASE_DOMAIN}
      N8N_PORT: '5678'
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Zurich}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'false'
      # The demo image's entrypoint installs the node package under this folder.
      N8N_USER_FOLDER: /data
      SKIP_NODE_REINSTALL: '1'
      # Deliberately no N8N_ENCRYPTION_KEY: this instance stores no credentials.
    volumes:
      # Holds only the node package and a throwaway SQLite file. Nothing here
      # is worth preserving; delete the volume to rebuild it from the image.
      - n8n_preview_data:/data
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:
  n8n_preview_data:

networks:
  edge:
    name: p9-edge
